name: Windows spike
on:
  push:
    branches: [spike, app, main, 'fusion/**', 'v017/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/ScreenAgent/ScreenAgent.csproj -c Release -p:SourceRevisionId=${{ github.sha }}
      - name: Shared vectors, hotkey and privacy tests
        run: dotnet test tests/ScreenAgent.Tests/ScreenAgent.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts
      - name: Publish unpackaged single exe
        run: dotnet publish src/ScreenAgent/ScreenAgent.csproj -c Release -o publish -p:SourceRevisionId=${{ github.sha }}
      - name: Local OCR fallback language models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/tessdata | Out-Null
          foreach ($lang in @('eng','deu')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/$lang.traineddata" -OutFile "publish/tessdata/$lang.traineddata"
          }
          # Tesseract's native loader needs real paths for its unmanaged dependencies.
          Get-ChildItem publish -Recurse | Select-Object FullName,Length
      - name: Generate OCR fixtures
        run: ./scripts/fixtures.ps1
      - name: Unpackaged OCR selftests
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($size in @(24,36,48)) {
            $out = Invoke-SA --selftest-ocr "fixtures/ocr-$size.png"
            $out | Set-Content "artifacts/ocr-$size.json"
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "OCR failed at $size" }
            $json = $out | ConvertFrom-Json
            foreach ($id in @('a#332179','a#b8c3ff')) {
              if ($json.Ids -notcontains $id) { throw "Missing $id at font size $size" }
            }
          }
      - name: In-memory OCR and forced bundled Tesseract selftests
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          foreach ($mode in @('memory-ocr','tesseract')) {
            foreach ($size in @(24,36,48)) {
              $out = Invoke-SA "--selftest-$mode" "fixtures/ocr-$size.png"
              $out | Set-Content "artifacts/$mode-$size.json"
              Write-Host $out
              if ($LASTEXITCODE -ne 0) { throw "$mode failed at $size" }
              $json = $out | ConvertFrom-Json
              foreach ($id in @('a#332179','a#b8c3ff')) {
                if ($json.Ids -notcontains $id) { throw "Missing $id for $mode at font size $size" }
              }
              if ($mode -eq 'tesseract' -and $json.Engine -ne 'tesseract') { throw 'Tesseract fallback was not exercised' }
            }
          }
      - name: Overlay selftest
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-ui | Tee-Object artifacts/overlay.json
          if ($LASTEXITCODE -ne 0) { throw 'Overlay selftest failed' }
      - name: Draw selftest (magenta 5 px strokes, clean capture, crop, click-through after release)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Invoke-SA --selftest-draw | Tee-Object artifacts/draw.json
          $code = $LASTEXITCODE
          if ($code -eq 2) { Write-Warning 'Draw selftest skipped; mouse input did not reach the overlay on this runner (see draw.json). Manual checklist remains required.'; exit 0 }
          elseif ($code -ne 0) { throw 'Draw selftest failed' }
      - name: Live activity rows selftest (message shows at once, 4 rows, tick and fail, click-through, left out of the capture)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Invoke-SA --selftest-activity | Tee-Object artifacts/activity.json
          if ($LASTEXITCODE -ne 0) { throw 'Activity overlay selftest failed' }
      - name: Screenshot feedback selftest (purple flash at most 12 percent, 220 px thumbnail, a capture contains none of it, fades out)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-feedback | Tee-Object artifacts/feedback.json
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot feedback selftest failed' }
      - name: Start-up timing on this runner (WebView2 environment, controller, first page)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-startup | Tee-Object artifacts/startup.json
          if ($LASTEXITCODE -ne 0) { throw 'Startup selftest failed' }
      - name: Change test on a real bitmap (5-digit number counts, caret does not, planner)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-frame testdata/screens/explainer-125.png | Tee-Object artifacts/frame.json
          if ($LASTEXITCODE -ne 0) { throw 'Frame change selftest failed' }
      - name: No console window (GUI subsystem)
        shell: pwsh
        run: |
          $fs = [IO.File]::OpenRead((Resolve-Path publish/ScreenAgent.exe))
          $buf = New-Object byte[] 4096; [void]$fs.Read($buf, 0, 4096); $fs.Dispose()
          $pe = [BitConverter]::ToInt32($buf, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($buf, $pe + 24 + 68)
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{ subsystem = $subsystem; meaning = @{ 2 = 'WINDOWS_GUI (no console)'; 3 = 'WINDOWS_CUI (console window)' }[[int]$subsystem] } | ConvertTo-Json | Tee-Object artifacts/subsystem.json
          if ($subsystem -ne 2) { throw "ScreenAgent.exe is subsystem $subsystem; expected 2 (GUI) so no console window opens" }
      - name: Hotkey selftest (Ctrl+Win untouched, Ctrl+Win+Shift any order, Alt+Win+Shift dictation, +M mute)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-hotkeys | Tee-Object artifacts/hotkeys.json
          $code = $LASTEXITCODE
          if ($code -eq 2) { Write-Warning 'Hotkey selftest skipped; see hotkeys.json for the runner limitation. Manual checklist remains required.'; exit 0 }
          elseif ($code -ne 0) { throw 'Hotkey selftest failed' }
      - name: Dictation selftest (real recorder and chunker, stand-in Desk, retry, retention, failure window, subtitle)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Invoke-SA --selftest-dictation testdata/e2e-actions.wav | Tee-Object artifacts/dictation.json
          if ($LASTEXITCODE -ne 0) { throw 'Dictation selftest failed' }
      - name: Desk pairing, native DPI bounds, window and status toast selftest
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-windows | Tee-Object artifacts/windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Desk pairing / native bounds / toast selftest failed' }
          # A missing WebView runtime/partial skip cannot stand in for the screenshots required by this release.
          Add-Type -AssemblyName System.Drawing
          foreach ($scale in @(100,125,150)) {
            $path = Join-Path $PWD "artifacts/desk-controller-$scale.png"
            if (-not (Test-Path $path)) { throw "Missing actual WebView screenshot at $scale percent rasterization" }
            $image = [System.Drawing.Image]::FromFile($path)
            try {
              if ($image.Width -lt 500 -or $image.Height -lt 300) { throw "Unexpected WebView screenshot size at $scale percent" }
              Write-Host "Controller $scale percent: $($image.Width)x$($image.Height) pixels"
            } finally { $image.Dispose() }
          }
      - name: Start briefing selftest (stub Desk, 50 MB transcript within 512 kB, UI Automation tabs, secrets, retry)
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Invoke-SA --selftest-briefing | Tee-Object artifacts/briefing.json
          if ($LASTEXITCODE -ne 0) { throw 'Start briefing selftest failed' }
      - name: Notepad injection and read-back
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-inject | Tee-Object artifacts/inject.json
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Warning 'Injection selftest skipped; see inject.json for the exact runner limitation. Manual checklist remains required.'
            exit 0
          }
          elseif ($code -ne 0) { throw 'Injection selftest failed' }
      - name: Measure and hash deliverables
        if: always()
        shell: pwsh
        run: |
          if (Test-Path publish/ScreenAgent.exe) {
            Compress-Archive -Path publish/tessdata -DestinationPath publish/tessdata.zip -Force
            $file = Get-Item publish/ScreenAgent.exe
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  ScreenAgent.exe" | Set-Content publish/SHA256SUMS.txt
            $zip = Get-Item publish/tessdata.zip
            $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            "$zipHash  tessdata.zip" | Add-Content publish/SHA256SUMS.txt
            $models = (Get-ChildItem publish/tessdata -File | Measure-Object Length -Sum).Sum
            @{ exeBytes=$file.Length; sha256=$hash; modelBytes=$models; tessdataZipBytes=$zip.Length; tessdataZipSha256=$zipHash; commit=$env:GITHUB_SHA } | ConvertTo-Json | Tee-Object artifacts/manifest.json
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScreenAgent-win-x64-spike
          path: |
            publish/ScreenAgent.exe
            publish/tessdata/
            publish/tessdata.zip
            publish/SHA256SUMS.txt
            artifacts/
          if-no-files-found: error
          retention-days: 14
