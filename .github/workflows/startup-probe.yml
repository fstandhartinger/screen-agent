name: Start-up probe
on:
  workflow_dispatch:
  push:
    branches: ['v017/**']
    paths: ['.github/workflows/startup-probe.yml']
permissions:
  contents: read
# Cold WebView2 start on a fresh runner, with the hidden-start fallback at different delays. Each job is a fresh machine, so each number is a cold start.
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: a-6000, fallback: 6000 }
          - { name: b-300, fallback: 300 }
          - { name: c-6000, fallback: 6000 }
          - { name: d-300, fallback: 300 }
    name: probe ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/ScreenAgent/ScreenAgent.csproj -c Release -o publish -p:SourceRevisionId=${{ github.sha }}
      - name: Cold start, fallback ${{ matrix.fallback }} ms
        shell: pwsh
        run: |
          . ./ci/invoke-sa.ps1
          Invoke-SA --selftest-startup ${{ matrix.fallback }} | Tee-Object startup.json
          if ($LASTEXITCODE -ne 0) { throw 'Startup selftest failed' }
